<!doctype html>
<html lang="pl">
<head>
  <title>mObywatel</title>
  <meta charset="UTF-8" />

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mObywatel">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no" />

  <link rel="stylesheet" href="assets/main.css" />
  <link rel="stylesheet" href="assets/card.css" />
</head>

<body>

  <!-- 🔵 COPY BUTTON (added, hidden style optional) -->
  <button id="copyAllDataBtn"
    style="position:fixed;bottom:20px;right:20px;z-index:9999;padding:10px 14px;border:none;border-radius:10px;background:#1a73e8;color:white;font-size:14px;">
    Copy Data
  </button>

  <div class="container">

    <p class="time_text" id="time"></p>

    <div class="id_image_data">
      <div class="id_own_image" id="photo_display"></div>

      <div class="id_data_grid">
        <p id="name"></p>
        <p id="surname"></p>
        <p id="nationality">POLSKIE</p>
        <p id="birthday"></p>
        <p id="pesel"></p>
      </div>
    </div>

    <div class="confirm_info">

      <p id="seriesAndNumber"></p>
      <p id="givenDate"></p>
      <p id="expiryDate"></p>

    </div>

  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

  let userData = {};
  try {
    userData = JSON.parse(localStorage.getItem('userData')) || {};
  } catch (e) {}

  const set = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.innerText = val || "";
  };

  // fill data
  set("name", (userData.name || "").toUpperCase());
  set("surname", (userData.surname || "").toUpperCase());
  set("pesel", userData.pesel);
  set("birthday", `${userData.day || ""}.${userData.month || ""}.${userData.year || ""}`);

  set("seriesAndNumber", userData.seriesAndNumber);
  set("givenDate", userData.givenDate);
  set("expiryDate", userData.expiryDate);

  // photo
  if (userData.image) {
    const photo = document.getElementById("photo_display");
    if (photo) {
      photo.style.backgroundImage = `url(${userData.image})`;
      photo.style.backgroundSize = "cover";
      photo.style.backgroundPosition = "center";
    }
  }

  // 💾 SAVE BACK
  localStorage.setItem("userData", JSON.stringify(userData));

  // ⏱ clock
  function updateTime() {
    const el = document.getElementById("time");
    if (el) {
      const now = new Date();
      el.innerText = `Czas: ${now.toLocaleTimeString('pl-PL')} ${now.toLocaleDateString('pl-PL')}`;
    }
  }
  setInterval(updateTime, 1000);
  updateTime();

  // 📋 COPY FULL LOCALSTORAGE (NEW FEATURE)
  const btn = document.getElementById("copyAllDataBtn");
  if (btn) {
    btn.addEventListener("click", () => {
      const data = localStorage.getItem("userData") || "{}";

      navigator.clipboard.writeText(data).then(() => {
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = "Copy Data", 1500);
      });
    });
  }

});
</script>

</body>
</html>
