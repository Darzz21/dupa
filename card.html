<!doctype html>
<html lang="pl">
<head>
  <title>mObywatel</title>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mObywatel">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="assets/main.css" />
  <link rel="stylesheet" href="assets/card.css" />
  <link rel="icon" type="image/x-icon" href="assets/images/logo.png" />
  <link rel="apple-touch-icon" href="assets/images/logo.png" />

  <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no" />
</head>

<body>

  <div class="top_grid_fixed">
    <div class="action_grid_fixed">
      <img src="assets/images/back_blue.png" class="back_img_fixed" />
      <p onclick="window.location.href='home.html'" class="back_text_fixed">Wróć</p>
    </div>
    <p class="title_text_fixed">mDowód</p>
  </div>

  <div class="container">
    <p class="time_text" id="time"></p>

    <div class="id_image_data">
      <div class="id_own_image" id="photo_display"></div>

      <div class="id_data_grid">
        <div class="data_holder">
          <p id="name"></p>
          <p>Imię (imiona)</p>
        </div>

        <div class="data_holder">
          <p id="surname"></p>
          <p>Nazwisko</p>
        </div>

        <div class="data_holder">
          <p>POLSKIE</p>
          <p>Obywatelstwo</p>
        </div>

        <div class="data_holder">
          <p id="birthday"></p>
          <p>Data urodzenia</p>
        </div>

        <div class="data_holder">
          <p id="pesel"></p>
          <p>PESEL</p>
        </div>
      </div>
    </div>

    <div class="confirm_info">
      <div class="confirm_box">
        <p>Seria i numer</p>
        <p id="seriesAndNumber"></p>
        <button id="copyBtn">Kopiuj</button>
      </div>

      <div class="confirm_box">
        <p>Termin ważności</p>
        <p id="expiryDate"></p>
      </div>

      <div class="confirm_box">
        <p>Data wydania</p>
        <p id="givenDate"></p>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const data = JSON.parse(localStorage.getItem("userData") || "{}");

    const safe = (v) => (v && v.toString().trim() ? v : "BRAK DANYCH");

    const set = (id, value, upper = false) => {
      const el = document.getElementById(id);
      if (el) el.innerText = upper ? safe(value).toUpperCase() : safe(value);
    };

    // PHOTO
    const photo = document.getElementById("photo_display");
    if (photo && data.image) {
      photo.style.backgroundImage = `url(${data.image})`;
      photo.style.backgroundSize = "cover";
      photo.style.backgroundPosition = "center";
    }

    // PERSONAL DATA
    set("name", data.name, true);
    set("surname", data.surname, true);
    set("pesel", data.pesel);

    if (data.day && data.month && data.year) {
      set("birthday", `${data.day}.${data.month}.${data.year}`);
    } else {
      set("birthday", "BRAK DANYCH");
    }

    // ID NUMBERS
    set("seriesAndNumber", data.seriesNumber);
    set("expiryDate", data.expiryDate);
    set("givenDate", data.givenDate);

    // COPY BUTTON
    const btn = document.getElementById("copyBtn");
    if (btn) {
      btn.addEventListener("click", () => {
        const text = document.getElementById("seriesAndNumber")?.innerText || "";
        navigator.clipboard.writeText(text);
        btn.innerText = "Skopiowano!";
        setTimeout(() => (btn.innerText = "Kopiuj"), 2000);
      });
    }

    // CLOCK
    function updateTime() {
      const now = new Date();
      const t = now.toLocaleTimeString("pl-PL", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      const d = now.toLocaleDateString("pl-PL");

      const el = document.getElementById("time");
      if (el) el.innerText = `Czas: ${t} ${d}`;
    }

    setInterval(updateTime, 1000);
    updateTime();

  });
  </script>

</body>
</html>
